<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Крутящийся гусь</title>
<style>
  :root { --bg:#0f1220; --card:#181c30; --text:#eef0ff; --muted:#8d93b8; --accent:#ffb703; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px 60px; }
  h1 { font-size:20px; font-weight:600; color:var(--muted); margin:0 0 8px; }
  .goose-wrap { width:240px; height:240px; margin:12px 0; }
  #goose { width:100%; height:100%; animation:spin 1.2s linear infinite; transform-origin:50% 50%; }
  #goose.stopped { animation:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #timer { font-size:clamp(20px,5vw,34px); font-weight:700; color:var(--accent); text-align:center; font-variant-numeric:tabular-nums; }
  #status { color:var(--muted); font-size:14px; margin-top:6px; min-height:20px; text-align:center; }
  .box { width:100%; max-width:560px; margin-top:32px; background:var(--card); border-radius:14px; padding:18px; }
  .box h2 { margin:0 0 12px; font-size:16px; }
  input, textarea { width:100%; background:#0f1220; color:var(--text); border:1px solid #2b3050; border-radius:8px;
                    padding:10px 12px; font:inherit; margin-bottom:8px; }
  textarea { resize:vertical; min-height:70px; }
  button { background:var(--accent); color:#222; border:0; border-radius:8px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #msg { color:var(--muted); font-size:13px; margin-left:10px; }
  .comment { border-top:1px solid #2b3050; padding:10px 0; }
  .comment:first-child { border-top:0; }
  .comment .who { font-weight:600; font-size:14px; }
  .comment .when { color:var(--muted); font-size:12px; margin-left:8px; font-weight:400; }
  .comment .text { margin-top:4px; white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>

<h1>Сколько ещё будет крутиться гусь</h1>

<div class="goose-wrap">
  <svg id="goose" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- тело -->
    <ellipse cx="100" cy="125" rx="58" ry="38" fill="#ffffff"/>
    <path d="M150 115 Q178 100 182 82 Q165 100 142 104 Z" fill="#e9ecf5"/>
    <ellipse cx="95" cy="130" rx="32" ry="20" fill="#e9ecf5"/>
    <!-- шея -->
    <path d="M62 112 Q38 90 52 56 Q60 40 74 44 Q64 62 76 84 Q86 100 84 112 Z" fill="#ffffff"/>
    <!-- голова -->
    <circle cx="66" cy="44" r="15" fill="#ffffff"/>
    <!-- клюв -->
    <path d="M52 42 L28 48 L52 54 Z" fill="#ff8a00"/>
    <!-- глаз -->
    <circle cx="68" cy="40" r="2.8" fill="#111"/>
    <!-- лапы -->
    <path d="M88 160 L86 180 L72 184 L90 186 L96 180 L96 160 Z" fill="#ff8a00"/>
    <path d="M112 160 L112 180 L100 186 L120 186 L124 178 L122 160 Z" fill="#ff8a00"/>
  </svg>
</div>

<div id="timer">Загрузка…</div>
<div id="status"></div>

<div class="box">
  <h2>Комментарии (+10 минут вращения за каждый)</h2>
  <input id="name" maxlength="20" placeholder="Имя (необязательно)">
  <textarea id="text" maxlength="200" placeholder="Напиши комментарий…"></textarea>
  <button id="send">Отправить</button><span id="msg"></span>
</div>

<div class="box" id="list"><div style="color:var(--muted)">Комментариев пока нет</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== 1. ВСТАВЬ СЮДА СВОЙ КОНФИГ ИЗ FIREBASE (см. инструкцию) =====
const firebaseConfig = {
  apiKey: "AIzaSyBi0RC--j0I8WmEaO2NCbePehR6Sd0IX-o",
  authDomain: "guseveb-b22e5.firebaseapp.com",
  projectId: "guseveb-b22e5",
  storageBucket: "guseveb-b22e5.firebasestorage.app",
  messagingSenderId: "287113037837",
  appId: "1:287113037837:web:1b699286554d744a9e6d44",
  measurementId: "G-X00DM1Z903"
};
// ====================================================================

const TEN_MIN = 10 * 60 * 1000;
const MONTH_MS = 30 * 24 * 60 * 60 * 1000;

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const stateRef = db.collection('state').doc('main');

const $ = id => document.getElementById(id);
let endTime = null;
let uid = null;

// ---- анонимный вход (нужен, чтобы ограничить частоту комментариев) ----
auth.signInAnonymously().catch(e => { $('msg').textContent = 'Ошибка входа: ' + e.message; });
auth.onAuthStateChanged(u => { if (u) { uid = u.uid; initState(); } });

async function initState() {
  const snap = await stateRef.get();
  if (!snap.exists) {
    try { await stateRef.set({ endTime: Date.now() + MONTH_MS }); } catch (e) {}
  }
}

// ---- общий таймер, синхронизация у всех ----
stateRef.onSnapshot(s => { if (s.exists) endTime = s.data().endTime; });

// Календарная разница: месяцы / дни / часы / минуты / секунды
function breakdown(fromMs, toMs) {
  const from = new Date(fromMs);
  let months = 0;
  while (true) {
    const d = new Date(from);
    d.setMonth(d.getMonth() + months + 1);
    if (d.getTime() <= toMs) months++; else break;
  }
  const base = new Date(from);
  base.setMonth(base.getMonth() + months);
  let rest = Math.floor((toMs - base.getTime()) / 1000);
  const days = Math.floor(rest / 86400); rest %= 86400;
  const hours = Math.floor(rest / 3600); rest %= 3600;
  const minutes = Math.floor(rest / 60);
  const seconds = rest % 60;
  return { months, days, hours, minutes, seconds };
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

function tick() {
  if (endTime === null) return;
  const now = Date.now();
  if (endTime <= now) {
    $('timer').textContent = '0 месяцев / 0 дней / 0 часов / 0 минут / 0 секунд';
    $('goose').classList.add('stopped');
    $('status').textContent = 'Гусь остановился 😢 Напиши комментарий, чтобы раскрутить его снова!';
    return;
  }
  $('goose').classList.remove('stopped');
  $('status').textContent = '';
  const t = breakdown(now, endTime);
  $('timer').textContent =
    `${t.months} ${plural(t.months,'месяц','месяца','месяцев')} / ` +
    `${t.days} ${plural(t.days,'день','дня','дней')} / ` +
    `${t.hours} ${plural(t.hours,'час','часа','часов')} / ` +
    `${t.minutes} ${plural(t.minutes,'минута','минуты','минут')} / ` +
    `${t.seconds} ${plural(t.seconds,'секунда','секунды','секунд')}`;
}
setInterval(tick, 250);

// ---- комментарии (видят все, в реальном времени) ----
function fmtDate(ts) {
  if (!ts) return '';
  return ts.toDate().toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}

db.collection('comments').orderBy('createdAt', 'desc').limit(50).onSnapshot(snap => {
  const list = $('list');
  list.innerHTML = '';
  if (snap.empty) { list.innerHTML = '<div style="color:var(--muted)">Комментариев пока нет</div>'; return; }
  snap.forEach(doc => {
    const c = doc.data();
    const el = document.createElement('div'); el.className = 'comment';
    const who = document.createElement('div'); who.className = 'who';
    who.textContent = c.name || 'Аноним';
    const when = document.createElement('span'); when.className = 'when';
    when.textContent = fmtDate(c.createdAt);
    who.appendChild(when);
    const text = document.createElement('div'); text.className = 'text';
    text.textContent = c.text;           // textContent — защита от XSS
    el.appendChild(who); el.appendChild(text);
    list.appendChild(el);
  });
});

// ---- отправка комментария ----
let cooldownUntil = 0;
const LAST_KEY = 'goose_last_post';
cooldownUntil = (+localStorage.getItem(LAST_KEY) || 0) + 60000;

setInterval(() => {
  const left = Math.ceil((cooldownUntil - Date.now()) / 1000);
  $('send').disabled = left > 0;
  if (left > 0) $('msg').textContent = `Подожди ${left} сек.`;
  else if ($('msg').textContent.startsWith('Подожди')) $('msg').textContent = '';
}, 500);

$('send').onclick = async () => {
  const text = $('text').value.trim();
  const name = $('name').value.trim();
  if (!text) { $('msg').textContent = 'Напиши что-нибудь'; return; }
  if (!uid) { $('msg').textContent = 'Подключаемся… попробуй ещё раз'; return; }
  $('send').disabled = true;
  try {
    const commentRef = db.collection('comments').doc();
    const userRef = db.collection('users').doc(uid);
    await db.runTransaction(async t => {
      const s = await t.get(stateRef);
      const cur = s.exists ? s.data().endTime : Date.now();
      const base = Math.max(cur, Date.now());
      t.set(stateRef, { endTime: base + TEN_MIN });
      t.set(userRef, { last: firebase.firestore.FieldValue.serverTimestamp() });
      t.set(commentRef, { name, text, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    });
    localStorage.setItem(LAST_KEY, Date.now());
    cooldownUntil = Date.now() + 60000;
    $('text').value = '';
    $('msg').textContent = '+10 минут гусю! 🪿';
  } catch (e) {
    console.error(e);
    $('msg').textContent = e.code === 'permission-denied'
      ? 'Слишком часто — подожди минуту' : 'Ошибка: ' + e.message;
    cooldownUntil = Date.now() + 5000;
  }
};
</script>
</body>
</html>
